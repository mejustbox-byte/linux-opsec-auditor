[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-opsec-auditor"
version = "0.1.0a2"
description = "Ограниченный аудит состояния Linux только на чтение и оценка нормализованных данных"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE.ru.md"]
authors = [{name = "GITHUB-OPSEC contributors"}]
dependencies = []

[project.scripts]
linux-opsec-auditor = "linux_opsec_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linux_opsec_auditor = ["*.json"]
