name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Python ${{ matrix.python }} synthetic tests and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked build tools
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-build.lock
      - name: Run nonempty unit and integration suite and repository checks
        run: PYTHONPATH=src python tools/verify.py
      - name: Build wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: '1791504000'
        run: python -m build --no-isolation
      - name: Install and smoke test wheel outside checkout
        run: python tools/smoke_wheel.py
      - name: Verify deterministic wheel rebuild
        run: python tools/check_reproducible.py
