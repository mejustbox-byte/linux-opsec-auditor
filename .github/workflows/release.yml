name: Publish verified prerelease assets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v0.1.0-alpha.1
  cancel-in-progress: false
env:
  RELEASE_TAG: v0.1.0-alpha.1
  RELEASE_COMMIT: 70d43abb5bbc5350e7df2ed20e41847bba36938e
  SOURCE_DATE_EPOCH: '1791504000'
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: product
    steps:
      - name: Checkout reviewed automation from the dispatch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: automation
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable product commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 70d43abb5bbc5350e7df2ed20e41847bba36938e
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag and checked out commit before running product code
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install hash-locked build tools
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-build.lock
      - name: Test and build exact tagged source
        run: |
          PYTHONPATH=src python tools/verify.py
          python -m build --no-isolation
          python tools/smoke_wheel.py
          python tools/check_reproducible.py
          python ../automation/tools/release_artifacts.py checksums --directory dist
          python ../automation/tools/release_artifacts.py verify --directory dist --repo .
      - name: Transfer verified artifacts within this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-v0.1.0-alpha.1
          if-no-files-found: error
          retention-days: 7
          path: |
            product/dist/linux_opsec_auditor-0.1.0a1-py3-none-any.whl
            product/dist/linux_opsec_auditor-0.1.0a1.tar.gz
            product/dist/SHA256SUMS
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-v0.1.0-alpha.1
          path: dist
      - name: Revalidate transferred artifacts before release writes
        run: python tools/release_artifacts.py verify --directory dist --repo .
      - name: Attach to existing release, verify downloads and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')" = commit
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/407852654" > release-before.json
          python tools/release_artifacts.py metadata --input release-before.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true --prerelease
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/linux_opsec_auditor-0.1.0a1-py3-none-any.whl dist/linux_opsec_auditor-0.1.0a1.tar.gz dist/SHA256SUMS
          gh api "repos/$GITHUB_REPOSITORY/releases/407852654" > release-uploaded.json
          python tools/release_artifacts.py metadata --input release-uploaded.json --require-assets
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded --pattern 'linux_opsec_auditor-0.1.0a1*' --pattern SHA256SUMS
          python tools/release_artifacts.py verify --directory downloaded --repo .
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          printf 'First experimental prerelease. Native wheel/source/SHA256SUMS attachments were built and verified from tag `%s` at commit `%s`.\n\n' "$RELEASE_TAG" "$RELEASE_COMMIT" > release-notes.md
          printf 'Release workflow: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          printf 'Original product PR: %s/%s/pull/1\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> release-notes.md
          git show "$RELEASE_COMMIT:docs/release-notes.md" >> release-notes.md
          printf '\n\nVerified attached checksums:\n```text\n' >> release-notes.md
          cat downloaded/SHA256SUMS >> release-notes.md
          printf '```\n' >> release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/407852654" > release-after.json
          python tools/release_artifacts.py metadata --input release-after.json --public --require-assets
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_COMMIT"
